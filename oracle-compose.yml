services:
  db:
    image: docker.io/library/postgres:13
    restart: unless-stopped
    network_mode: host
    command: ["postgres", "-p", "5434", "-c", "listen_addresses=127.0.0.1"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5434 -q -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.oracle
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5434/${POSTGRES_DB}?schema=public
      DATABASE_URL_UNPOOLED: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5434/${POSTGRES_DB}?schema=public
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -fLs http://127.0.0.1:3000/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  frontend:
    build: ./frontend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.oracle
    environment:
      NEXT_PUBLIC_API_URL: https://pongmastersapi.obeaj.me
      NEXT_PUBLIC_WS_URL: wss://pongmastersapi.obeaj.me
      NEXT_PUBLIC_FRONTEND_URL: https://pongmasters.obeaj.me
      NEXT_PUBLIC_BACK_END_URL: https://pongmastersapi.obeaj.me/
      NEXT_PUBLIC_FRONT_END_URL: https://pongmasters.obeaj.me
    depends_on:
      - backend
volumes:
  postgres_data:
